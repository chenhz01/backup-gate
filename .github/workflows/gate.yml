name: backup-gate
on: [push, pull_request]
jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: help loads
        run: python gate.py --help
      - name: run bundled example
        # the example is designed to FAIL — that is what the gate is for.
        # but it must actually run and actually say something: empty output = broken gate.
        run: |
          set +e
          python gate.py verify examples/data > out.txt 2>&1
          code=$?
          cat out.txt
          echo "exit=$code (non-zero is expected here)"
          test -s out.txt || { echo "no output — gate did not run"; exit 1; }
          exit 0
