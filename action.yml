name: backup-gate
description: 'Backup integrity verifier: a backup you never verified is a rumor. Manifest, tamper-evident verify, checklist.'
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: 'Arguments for gate.py. Correct usage: verify path/to/data — paths are relative to YOUR repo, not this action.'
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    # 没有参数时只打印帮助并 exit 0 —— 那会显示成绿色但什么都没检查。
    # 这里显式告警，避免「装了但没检查」被误当成已通过。
    # 告警里必须写这道门**自己的**用法（每门子命令不同，写死一句会误导）。
    - shell: bash
      if: ${{ inputs.args == '' || inputs.args == '--help' }}
      run: |
        echo "::warning title=backup-gate::No args given - this gate inspected nothing. Correct usage: args: verify path/to/data"
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
