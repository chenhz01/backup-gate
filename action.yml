name: backup-gate
description: Backup integrity verifier: a backup you never verified is a rumor. Manifest, tamper-evident verify, checklist.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
